# Microservicio A: pacientes (E1, C3).
# Para F1 cambiar replicas a 3; para F3 cambiar el tag de la imagen a v1.1.0. Ambos con kubectl apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacientes
  namespace: maximos
  labels:
    app: pacientes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pacientes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pacientes
    spec:
      containers:
        - name: pacientes
          image: REGION-docker.pkg.dev/PROJECT_ID/vet-repo/pacientes:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
