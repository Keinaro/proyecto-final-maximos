apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
  namespace: maximos
data:
  init.sql: |
    
    -- Proyecto Final de Virtualizacion
    -- Caso 1: Clinica Veterinaria
    -- Rol 04: Base de datos y configuracion
    -- Motor: PostgreSQL 16
    
    -- 1. Integrantes del equipo
    CREATE TABLE IF NOT EXISTS integrantes (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        carne VARCHAR(20) NOT NULL UNIQUE
    );
    
    -- 2. Pacientes de la clinica veterinaria
    CREATE TABLE IF NOT EXISTS pacientes (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        especie VARCHAR(50) NOT NULL,
        raza VARCHAR(80),
        fecha_nacimiento DATE,
        propietario_nombre VARCHAR(120) NOT NULL,
        propietario_telefono VARCHAR(20)
    );
    
    -- 3. Citas de los pacientes
    CREATE TABLE IF NOT EXISTS citas (
        id SERIAL PRIMARY KEY,
        paciente_id INTEGER NOT NULL
            REFERENCES pacientes(id) ON DELETE RESTRICT,
        fecha_hora TIMESTAMP NOT NULL,
        motivo VARCHAR(200) NOT NULL,
        veterinario VARCHAR(100),
        estado VARCHAR(20) NOT NULL DEFAULT 'programada'
    );
    
    
    -- 4. Integrantes del equipo
    INSERT INTO integrantes (nombre, carne)
    VALUES
        ('Giancarlo Ortega Bonilla', '1230222'),
        ('Jose Daniel Paz Ortega', '1200022'),
        ('Ana Sofia Asturias To', '1078123'),
        ('Julio Javier Robles Garcia', '1248823'),
        ('Ana Lucia Chavez Penagos', '1067423'),
        ('Jorge Francisco Munoz Portela', '1177523')
    ON CONFLICT (carne)
    DO UPDATE SET nombre = EXCLUDED.nombre;
