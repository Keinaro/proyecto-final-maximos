# Interno al clúster. "db" es el DB_HOST que leen pacientes y citas desde app-config.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: maximos
  labels:
    app: db
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
