
# Deployment de PostgreSQL
# Rol 04 - Base de datos y configuracion

apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: maximos
  labels:
    app: db

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: db
          image: us-central1-docker.pkg.dev/veterinaria-maximos-final/vet-repo/db:16
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data

            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc

        - name: db-init
          configMap:
            name: db-init-sql
