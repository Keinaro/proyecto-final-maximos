# PostgreSQL 16 (E4, C3). La imagen es la copia de postgres:16 que sube scripts/build-push.sh.
# El ConfigMap db-init lo crea scripts/deploy.sh a partir de db/init.sql; solo corre si el disco está vacío.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: maximos
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  # El disco es ReadWriteOnce: el Pod viejo debe soltarlo antes de que arranque el nuevo.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: REGION-docker.pkg.dev/PROJECT_ID/vet-repo/db:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            # El disco trae lost+found en la raíz; postgres necesita un subdirectorio vacío.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: init
          configMap:
            name: db-init
