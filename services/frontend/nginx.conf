server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos del frontend (SPA / HTML plano)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia Microservicio A: Pacientes (E6: resolución por nombre DNS del Service)
    location /api/pacientes {
        proxy_pass http://pacientes:8080/pacientes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy inverso hacia Microservicio B: Citas (E6: resolución por nombre DNS del Service)
    location /api/citas {
        proxy_pass http://citas:8080/citas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy inverso hacia endpoint de integrantes en Microservicio Pacientes (A4)
    location /api/integrantes {
        proxy_pass http://pacientes:8080/integrantes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Endpoints de salud para visualizar estado y versión (útil en F3 rolling update)
    location = /api/health/pacientes {
        proxy_pass http://pacientes:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/health/citas {
        proxy_pass http://citas:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

